[package]
name = "wind-dict"
version = "0.1.0"
edition = "2021"
description = "常驻托盘的桌面词典：全局热键唤起，离线词典为主"
license = "MIT"

[dependencies]
# GUI。走本地路径：本项目依赖 windui 尚未发布的「后台工具」能力（全局热键、
# EventCtx 显隐窗口、关闭拦截转隐藏、启动即隐藏），见 docs/adr/0004。
windui = { path = "../wind-ui-rust" }

# 词库与用户数据。bundled 编入 SQLite 自身，免去用户装 DLL。
# 二进制因此 +~1.5MB——相对 windui 的极简理念是笔真实开销，见 docs/adr/0006。
rusqlite = { version = "0.32", features = ["bundled"] }

# MDX 词库的块解压（zlib）。后端是纯 Rust 的 miniz_oxide，不引 C 工具链。
#
# 唯一为「运行时直读 MDX」新增的依赖：解压是那条路上真正绕不过去的一环，其余
# （ripemd128、键序归一化、样式表展开）都在本仓库里自己写了，见 src/store/mdx。
flate2 = "1"

# 错误传播。词典的失败模式（库损坏、网络、API 报错）对用户都是「查不到」，
# 不需要调用方按类型分支处理，故用 anyhow 而非自定义错误枚举。
anyhow = "1"

# 开机自启：读写 `HKCU\...\Run` 注册表项。这是本项目第一个平台特定依赖。
#
# 取 windows crate 而非调 `reg.exe` 子进程：后者零依赖，但要拼命令行、解析输出，
# 且「程序启动子进程改注册表 Run 键」正是杀软重点盯防的行为模式，误报风险实打实。
# 只启用注册表一个 feature，编译期开销可控。
[target.'cfg(windows)'.dependencies]
# `Win32_UI_WindowsAndMessaging` 是为 `main::fatal` 的消息框加的：程序改成无控制台的
# GUI 子系统后，启动期致命错误（词库打不开）原先那几行 eprintln 无处可去，用户看到的
# 只是「双击了没反应」。
windows = { version = "0.58", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # 老 MDX 词典的 GBK / Big5 正文靠 MultiByteToWideChar 解码。系统自带这些代码页的
    # 映射表，引一份几百 KB 的静态编码表进二进制去做同一件事并不划算。
    "Win32_Globalization",
] }

# 仅构建期工具（examples/build_ecdict.rs）与测试使用。
#
# csv 放这里而非 [dependencies] 是刻意的：词库构建是**开发期**的一次性动作，
# 其产物是随程序分发的 .db 文件。运行时只读 SQLite，永远不碰 CSV。
# 放进 [dependencies] 会让 csv 及其依赖被链进那个以体积为卖点的最终二进制。
[dev-dependencies]
csv = "1"

# 把 assets/wind-dict.ico 编进 exe 的资源段（组图标名 `MAINICON`）。
#
# 缺了它，任务栏与 Alt-Tab 里这个程序是**一块空白**：windui 建窗口类时按
# `LoadIconW(hinst, "MAINICON")` 取图标（platform/win32/mod.rs），exe 里没有这份
# 资源就退到 `HICON::default()`——即"没有图标"。托盘图标是另一条路（`Tray::icon_rgba`
# 直接吃裸字节），所以此前托盘有图标、任务栏没有，看起来像是只有任务栏坏了。
#
# 取 embed-resource 而非手搓：它负责找 Windows SDK 里的 rc.exe（路径随 SDK 版本变）、
# 处理交叉编译与 MSVC/GNU 两套工具链。它是 **build-dependency**，只在构建期跑，
# 一个字节都不会进最终二进制——与上面 csv 那条是同样的取舍。
[build-dependencies]
embed-resource = "3"

[profile.release]
# 与 windui 对齐：体积优先 + LTO。词库才是体积大头，代码段能省则省。
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
