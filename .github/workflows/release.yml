# 推 v* 标签即发布。
#
# 干活的是 `scripts/release.ps1`，本文件只负责把它需要的东西摆好、再把产物送上去。
# **发布逻辑一份，不是两份**——本地 `.\scripts\dev.ps1 rel` 与这里跑的是同一个脚本，
# 否则"本地打的包"和"CI 打的包"迟早不是一回事，而那种差异只有用户会发现。
#
# ## 两种跑法
#
# **正式发布**：把 Cargo.toml 的版本改成 0.2.0 并提交 → `git tag v0.2.0` →
# `git push origin v0.2.0`。脚本会核对 tag 与 Cargo.toml，对不上就当场失败，
# 不会发出一个版本号说不清的包。
#
# **试发布**（本文件在任意分支上手动 workflow_dispatch）：走完一模一样的
# 构建 → 组装 → 验证 → 压包，但**不建 Release、不动任何 tag**，产物只作为
# 构建物留 5 天。这条路存在的理由是：这条流水线上真正没把握的是打包与冒烟那几步
# （runner 上能不能建窗口、能不能渲染），而它们不该等到第一次真发布时才第一次跑。
#
# 发不发布由 `github.ref` 是不是 tag 决定，不由某个输入开关决定——开关会被忘在
# 打开的位置上，而"这是不是一个 tag"没有中间状态。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      smoke:
        description: "跑启动冒烟（runner 起不来窗口时选 false）"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布前先过一遍与日常推送**同一套**检查。
  #
  # tag 指向的提交未必被 CI 跑过：可以打在几天前的某个提交上，也可以打在一个只改了
  # Cargo.toml 版本号、还没推过的提交上。到那时才发现编不过，是这条流水线里最贵的
  # 一种失败——词库已经下完、包已经打了一半。
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # 被调用的工作流默认拿不到 secrets。windui 现在是公开库、退到 github.token 也能
    # 检出，但那是**当前**的事实；哪天它转私有，缺了这一行的表现是 checkout 报 404。
    secrets: inherit

  release:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write # 建 Release、传附件
    steps:
      # 并排检出，理由同 ci.yml：windui 是 path 依赖。
      # 这一步还有个发布专有的意义：release.ps1 会记下 windui 的提交号写进包内
      # README——path 依赖占了这个 exe 的一大半，不记它，"这个包从哪来的"只答对一半。
      - uses: actions/checkout@v5
        with:
          path: wind-dict

      # windui 检出哪一版由 windui.ref 说了算，理由见 ci.yml 与那个文件本身。
      # 发布这边尤其要紧：包内 README 写着的那个 windui 提交号必须**确有其事**，
      # 而不是"发布那天默认分支恰好是什么"。
      - name: 定位 windui
        id: windui
        shell: pwsh
        run: |
          $ref = "${{ vars.WINDUI_REF }}".Trim()
          if (-not $ref) {
            $lines = @(Get-Content wind-dict/windui.ref | Where-Object { $_ -notmatch '^\s*(#|$)' })
            if ($lines.Count -eq 0) { throw "windui.ref 里没有提交号" }
            $ref = $lines[0].Trim()
          }
          Write-Host "windui → $ref"
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/checkout@v5
        with:
          repository: huanfeng/wind-ui-rust
          ref: ${{ steps.windui.outputs.ref }}
          path: wind-ui-rust
          token: ${{ secrets.WINDUI_TOKEN || github.token }}

      - name: 工具链
        shell: pwsh
        run: rustc --version; cargo --version

      # **不缓存词库，也不缓存它的下载源。**
      #
      # 缓存能省下每次约十分钟（下 63MB 的 ECDICT CSV + 建 190MB 的库），但代价是
      # 发布出去的词库内容会被冻在缓存里，而这件事**没有任何外在表现**——版本号照涨，
      # 词库还是上个月那份。发布一年也就几次，十分钟买一个"词库确实是这次现下的"，
      # 划算。cargo 那边照缓存：它是按 Cargo.lock + windui 提交号定址的，不存在同样
      # 的问题。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ runner.os }}-${{ steps.windui.outputs.ref }}-${{ hashFiles('wind-dict/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-

      - name: 打包
        shell: pwsh
        working-directory: wind-dict
        run: |
          # 冒烟这一步要建窗口、要渲染。跑不通就用 workflow_dispatch 把 smoke 关掉，
          # **不要**为了让流水线变绿把它默认改成关——那是唯一一道端到端的检查。
          #
          # 参数用**哈希表** splat，不能用数组。PowerShell 的数组 splat 按**位置**绑定：
          # @("-Repo", "owner/name") 会把字符串 "-Repo" 当成值塞给第一个位置参数
          # （$Out），仓库名顺位落到 $ExpectVersion。两个参数都是 [string]，什么字符串
          # 都收，于是**一步都不报错**，一直漂到「版本对不上: git tag 说 owner/name」
          # 才现形——而那句话指着一个与病因毫无关系的地方。第一次试跑就是这么挂的。
          # 哈希表 splat 才按名字绑定，开关参数写成 .NoSmoke = $true。
          #
          # 变量名避开 $args：那是 PowerShell 的自动变量，往里写值能跑，但读起来
          # 像在改函数的入参。
          $relArgs = @{ Repo = "${{ github.repository }}" }
          # 只有 tag 触发时才核对版本号。手动试跑时 github.ref_name 是分支名，
          # 拿它去比 Cargo.toml 只会得到一句"版本对不上: main"。
          if ("${{ github.ref_type }}" -eq "tag") {
            $relArgs.ExpectVersion = "${{ github.ref_name }}"
          }
          if ("${{ github.event.inputs.smoke }}" -eq "false") { $relArgs.NoSmoke = $true }
          # 把实际传进去的参数打出来。上面那个 bug 之所以难查，正是因为日志里看不到
          # 脚本最终收到了什么。
          $relArgs.GetEnumerator() | ForEach-Object { Write-Host "  -$($_.Key) $($_.Value)" }
          .\scripts\release.ps1 @relArgs

      # 冒烟的截图留作构建物：出问题时"那个包长什么样"是第一手证据，而它不进发布包。
      - name: 留存冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: wind-dict/artifacts/release/*.png
          if-no-files-found: ignore

      # 试跑时把整个包留下来，好让人真的解压双击一次。
      # tag 触发时不留：同一份 190MB 传两遍（一份 Release 附件、一份构建物）没有意义。
      - name: 留存待发布的包（试跑）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-package
          path: |
            wind-dict/artifacts/release/*.zip
            wind-dict/artifacts/release/*.zip.sha256
            wind-dict/artifacts/release/wind-dict.json
          retention-days: 5
          # 词库已是压过的 .db，再压一遍只是白费时间。
          compression-level: 0

      - name: 建 Release 并上传
        if: github.ref_type == 'tag'
        shell: pwsh
        working-directory: wind-dict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "artifacts\release"
          # 逐个列出而不是靠通配：gh 不展开通配符，交给它一个没展开的 * 会得到一个
          # "文件不存在"，而不是一次少传附件——后者更难发现。
          $files = @(
            Get-ChildItem $dir -Filter "*.zip"
            Get-ChildItem $dir -Filter "*.zip.sha256"
            Get-ChildItem $dir -Filter "wind-dict.json"
          ) | ForEach-Object { $_.FullName }
          if (-not $files) { throw "artifacts\release 下没有可上传的产物" }
          $files | ForEach-Object { Write-Host "上传 $_" }
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            @files

      - name: 试跑结束（未发布）
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          Write-Host "试跑完成：包已打出并通过全部验证，但**没有**建 Release。"
          Write-Host "正式发布请改 Cargo.toml 版本、提交，然后 git tag vX.Y.Z && git push origin vX.Y.Z"

  # 通知自己的 scoop bucket 更新清单。
  #
  # **不传哈希**：对端会自己按 URL 把资产拉下来算 sha256。传过去反而多一处可能不一致
  # ——两边算法、时序、甚至"算的是不是同一个文件"都得对上，而那些都是白担的风险。
  #
  # 只在 tag 触发时跑：试跑不该动 bucket。与「建 Release」那一步同一条判据。
  notify-scoop-bucket:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # 只取那一个文件。这个 job 与代码无关，检出整个仓库（含 Cargo.lock、词库脚本）
      # 只是让它慢。
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scoop.json
          sparse-checkout-cone-mode: false

      - name: 读 scoop.json
        id: scoop
        run: |
          set -euo pipefail
          for key in name bin description homepage license; do
            echo "$key=$(jq -er ".$key" .github/scoop.json)" >> "$GITHUB_OUTPUT"
          done

      - name: 向 scoop-bucket 发 repository_dispatch
        env:
          # tag 是 vX.Y.Z，清单里的 version 不带 v。release.ps1 已核对过它与
          # Cargo.toml 一致，故从 tag 反推是安全的。
          VERSION: ${{ github.ref_name }}
          APP: ${{ steps.scoop.outputs.name }}
          # 两个名字都认：姊妹项目 keyremap 用的是 SCOOP_TOKEN，别处有叫
          # SCOOP_BUCKET_GITHUB_TOKEN 的。少一个二选一的配置步骤。
          TOKEN: ${{ secrets.SCOOP_TOKEN || secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 先明说缺什么。否则空 token 只会换来一个 401，看不出是没配 secret。
          if [ -z "$TOKEN" ]; then
            echo "::error::未配置 secret SCOOP_TOKEN（或 SCOOP_BUCKET_GITHUB_TOKEN），" \
                 "需要一个对 huanfeng/scoop-bucket 有 contents:write 权限的 PAT"
            exit 1
          fi
          VER="${VERSION#v}"
          ASSET="${APP}-${VER}-x64.zip"
          echo "通知 bucket: $APP $VER ($ASSET)"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/huanfeng/scoop-bucket/dispatches" \
            -d "$(jq -n \
              --arg app "$APP" \
              --arg repo "${{ github.repository }}" \
              --arg version "$VER" \
              --arg asset_name "$ASSET" \
              --arg bin "${{ steps.scoop.outputs.bin }}" \
              --arg description "${{ steps.scoop.outputs.description }}" \
              --arg homepage "${{ steps.scoop.outputs.homepage }}" \
              --arg license "${{ steps.scoop.outputs.license }}" \
              '{
                event_type: "update-scoop-manifest",
                client_payload: {
                  app: $app,
                  repo: $repo,
                  version: $version,
                  asset_name: $asset_name,
                  bin: $bin,
                  description: $description,
                  homepage: $homepage,
                  license: $license
                }
              }'
            )"
